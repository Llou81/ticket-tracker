server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's embedded DNS. Resolving "backend" per request (via the variable below) instead of once
  # at startup keeps the proxy working when the backend container is recreated with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API: same origin, proxied to the backend container.
  location /api/ {
    set $backend http://backend:3000;
    # With a variable and no URI part, nginx forwards the original request URI unchanged.
    proxy_pass $backend;
    # $http_host keeps the port, so the backend's Origin check matches the browser's origin.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets can be cached aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: client-side routes resolve to index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
